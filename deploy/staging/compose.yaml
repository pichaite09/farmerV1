name: farmer-main-staging
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmer_main_test
      POSTGRES_DB: farmer_main_test
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?required}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U farmer_main_test -d farmer_main_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  api:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://farmer_main_test:${STAGING_POSTGRES_PASSWORD:?required}@postgres/farmer_main_test
      JWT_SECRET: ${STAGING_JWT_SECRET:?required}
      CORS_ORIGINS: ${STAGING_CORS_ORIGINS:-["http://localhost:8091"]}
      FIREBASE_PROJECT_ID: ${STAGING_FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${STAGING_FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${STAGING_FIREBASE_PRIVATE_KEY:-}
      ATTACHMENT_STORAGE_PATH: /data/attachments
    volumes:
      - staging_attachment_data:/data/attachments
    expose: [8090]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [private, edge]
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private]
volumes:
  staging_postgres_data:
    name: farmer_main_staging_postgres_data
  staging_attachment_data:
    name: farmer_main_staging_attachment_data
networks:
  private:
    internal: true
  edge: {}
