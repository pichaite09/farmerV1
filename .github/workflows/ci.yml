# CI validation for pull requests and main
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmer_main_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: farmer_main_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U farmer_main_test -d farmer_main_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://farmer_main_test:ci-test-only@127.0.0.1:5432/farmer_main_test
      JWT_SECRET: ci-test-secret-not-for-production-012345678901234567890123
      CORS_ORIGINS: '["http://localhost:8091"]'
      ATTACHMENT_STORAGE_PATH: /tmp/farmer-main-ci-attachments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=FARM_API_BASE_URL=/

  phase5-gates:
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate safe release gates
        run: bash scripts/phase5-gates.sh compose
      - name: Verify isolated PostgreSQL recovery
        run: bash scripts/backup-restore-isolated.sh
